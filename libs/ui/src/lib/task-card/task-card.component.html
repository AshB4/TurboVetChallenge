<tvfe-card>
  <div card-header class="task-card__header">
    <div class="task-card__title-group">
      <span class="task-card__title">{{ task.title }}</span>
      <span class="task-card__assignee" *ngIf="task.assignee">Assigned to {{ task.assignee }}</span>
    </div>
    <span class="task-card__status" [ngClass]="task.status ?? 'todo'">
      {{ statusLabel() }}
    </span>
  </div>

  <div class="task-card__body">
    <p *ngIf="task.description; else emptyDescription">{{ task.description }}</p>
    <ng-template #emptyDescription>
      <p class="task-card__placeholder">No description provided yet.</p>
    </ng-template>

    <dl class="task-card__meta" *ngIf="task.dueDate">
      <div>
        <dt>Due</dt>
        <dd>{{ task.dueDate | date: 'mediumDate' }}</dd>
      </div>
    </dl>
  </div>

  <div card-footer class="task-card__footer">
    <ng-content select="[task-actions]"></ng-content>
  </div>
</tvfe-card>
